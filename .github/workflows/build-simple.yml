name: Build, Test, Release and Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.x'
  NODE_VERSION: '22'
  DOCKER_IMAGE: baitaotao521/traffic_consumer

jobs:
  quality:
    name: Go Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Verify formatting
        run: |
          gofmt -w .
          git diff --exit-code

      - name: Run unit tests
        run: go test ./...

  build-executables:
    name: Build Executable for ${{ matrix.platform_label }}
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_label: Linux
            goos: linux
            goarch: amd64
            binary_name: traffic_consumer_Linux
            binary_suffix: ''
          - platform_label: Windows
            goos: windows
            goarch: amd64
            binary_name: traffic_consumer_Windows
            binary_suffix: '.exe'
          - platform_label: macOS
            goos: darwin
            goarch: arm64
            binary_name: traffic_consumer_macOS
            binary_suffix: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build executable
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.binary_name }}${{ matrix.binary_suffix }}" .

      - name: Smoke test executable
        if: matrix.goos == 'linux'
        run: ./dist/${{ matrix.binary_name }} --help

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: traffic_consumer_${{ matrix.platform_label }}
          path: dist/${{ matrix.binary_name }}${{ matrix.binary_suffix }}
          if-no-files-found: error
          retention-days: 14

  build-and-push-docker:
    name: Build and Push Docker Image
    needs: quality
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag

      - name: Check Docker Hub credentials
        id: docker-creds
        shell: bash
        run: |
          if [[ -n "${DOCKER_USERNAME}" && -n "${DOCKER_PASSWORD}" ]]; then
            echo "can_push=true" >> "${GITHUB_OUTPUT}"
          else
            echo "can_push=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && steps.docker-creds.outputs.can_push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and optionally push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && steps.docker-creds.outputs.can_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-executables, build-and-push-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -maxdepth 3 -type f -print

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/traffic_consumer_Linux/traffic_consumer_Linux
            artifacts/traffic_consumer_Windows/traffic_consumer_Windows.exe
            artifacts/traffic_consumer_macOS/traffic_consumer_macOS
          generate_release_notes: true
